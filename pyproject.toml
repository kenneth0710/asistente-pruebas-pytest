[project]
name = "asistente-pruebas-pytest"
version = "0.1.0"
description = "Asistente de IA que propone pruebas pytest a partir de los criterios de aceptación del módulo de pedidos"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "criterio(id): criterio de aceptación que cubre la prueba, por ejemplo HU-07-E1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E: estilo, F: errores, B: errores probables (bugbear), S: seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar en pytest (justificado en revision_seguridad.md)
"tests/*" = ["S101"]
